<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="t d"><title id="t">ObservedState.dev hosting architecture</title><desc id="d">Reader to Route 53 to CloudFront with a viewer-request function, ACM certificate, and a private S3 bucket reached through Origin Access Control, all in the stacknimbus AWS account.</desc><defs><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#a9b6c6"/></marker><marker id="ams" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#a9b6c6"/></marker><marker id="at" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#3ddbb1"/></marker><marker id="ats" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#3ddbb1"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#f2b34a"/></marker><marker id="aas" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#f2b34a"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#5b9bff"/></marker><marker id="abs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#5b9bff"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#ff7a8a"/></marker><marker id="ars" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ff7a8a"/></marker><marker id="av" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#9b8cff"/></marker><marker id="avs" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#9b8cff"/></marker></defs><rect width="1400" height="840" fill="#0a1018"/><text x="40" y="52" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e8eef5" text-anchor="start" opacity="1">Hosting architecture</text><text x="40" y="78" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">observedstate.dev: static Astro site, private S3 origin, HTTPS only</text><rect x="40" y="90" width="64" height="3" rx="1.5" fill="#3ddbb1"/><rect x="108" y="90" width="26" height="3" rx="1.5" fill="#f2b34a"/><rect x="290" y="118" width="1070" height="618" rx="14" fill="none" stroke="#3a4b63" stroke-width="1.5" stroke-dasharray="6 6" opacity="1"/><text x="310" y="144" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#a9b6c6" text-anchor="start" opacity="1">AWS account  stacknimbus  392264151451</text><g opacity="1"><rect x="68.0" y="368.0" width="64" height="64" rx="12.0" fill="#121b27" stroke="#3a4b63" stroke-width="1.5"/><g transform="translate(68.0,368.0) scale(1.0)" fill="none" stroke="#e8eef5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="14" width="46" height="36" rx="4"/><path d="M9 25 H55"/><circle cx="16" cy="19.5" r="1.4" fill="#e8eef5"/><circle cx="22" cy="19.5" r="1.4" fill="#e8eef5"/><circle cx="32" cy="38" r="8"/><path d="M24 38 H40"/></g></g><text x="100" y="452.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eef5" text-anchor="middle" opacity="1">Reader</text><text x="100" y="469.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">any browser</text><g opacity="1"><rect x="368.0" y="198.0" width="64" height="64" rx="12.0" fill="#5b9bff" stroke="none" stroke-width="1.5"/><g transform="translate(368.0,198.0) scale(1.0)" fill="none" stroke="#0a1018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="18" r="5"/><circle cx="18" cy="46" r="5"/><circle cx="46" cy="46" r="5"/><path d="M29.5 22.5 L20.5 41.5 M34.5 22.5 L43.5 41.5 M23 46 H41"/></g></g><text x="400" y="282.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eef5" text-anchor="middle" opacity="1">Route 53</text><text x="400" y="299.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">hosted zone observedstate.dev</text><text x="400" y="314.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">A and AAAA alias: apex + www</text><g opacity="1"><rect x="668.0" y="368.0" width="64" height="64" rx="12.0" fill="#5b9bff" stroke="none" stroke-width="1.5"/><g transform="translate(668.0,368.0) scale(1.0)" fill="none" stroke="#0a1018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="17"/><ellipse cx="32" cy="32" rx="7.5" ry="17"/><path d="M15 32 H49 M18 22 H46 M18 42 H46"/></g></g><text x="700" y="452.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eef5" text-anchor="middle" opacity="1">CloudFront</text><text x="700" y="469.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">distribution, HTTPS only</text><text x="700" y="484.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">aliases: apex + www</text><g opacity="1"><rect x="668.0" y="198.0" width="64" height="64" rx="12.0" fill="#5b9bff" stroke="none" stroke-width="1.5"/><g transform="translate(668.0,198.0) scale(1.0)" fill="none" stroke="#0a1018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26 16 C20 16 20 22 20 26 C20 30 18 32 14 32 C18 32 20 34 20 38 C20 42 20 48 26 48 M38 16 C44 16 44 22 44 26 C44 30 46 32 50 32 C46 32 44 34 44 38 C44 42 44 48 38 48"/><path d="M28 36 L36 28" /></g></g><text x="746.0" y="226" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eef5" text-anchor="start" opacity="1">CloudFront Function</text><text x="746.0" y="243" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">viewer-request on every request</text><text x="746.0" y="258" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">/path/ to /path/index.html</text><g opacity="1"><rect x="1028.0" y="183.0" width="64" height="64" rx="12.0" fill="#f2b34a" stroke="none" stroke-width="1.5"/><g transform="translate(1028.0,183.0) scale(1.0)" fill="none" stroke="#0a1018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="15" width="38" height="28" rx="3"/><path d="M20 24 H44 M20 31 H34"/><circle cx="42" cy="42" r="7" fill="#0a1018"/><path d="M39 42 L41.3 44.5 L45.5 39.5"/><path d="M38 48 L36 56 L42 53 L48 56 L46 48"/></g></g><text x="1060" y="267.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eef5" text-anchor="middle" opacity="1">ACM certificate</text><text x="1060" y="284.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">us-east-1</text><text x="1060" y="299.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">observedstate.dev + www</text><g opacity="1"><rect x="1078.0" y="368.0" width="64" height="64" rx="12.0" fill="#3ddbb1" stroke="none" stroke-width="1.5"/><g transform="translate(1078.0,368.0) scale(1.0)" fill="none" stroke="#0a1018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="20" rx="16" ry="5.5"/><path d="M16 20 L20.5 47 C21 52 43 52 43.5 47 L48 20"/><path d="M19 30 C26 35 38 35 45 30"/></g></g><text x="1110" y="452.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eef5" text-anchor="middle" opacity="1">S3 bucket</text><text x="1110" y="469.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">observedstate-site-392264151451</text><text x="1110" y="484.0" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a9b6c6" text-anchor="middle" opacity="1">private, Block Public Access on</text><path d="M100 364 V230 H352" fill="none" stroke="#a9b6c6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#am)" stroke-linejoin="round"/><circle cx="125" cy="215" r="11" fill="#a9b6c6"/><text x="125" y="219.5" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0a1018" text-anchor="middle" opacity="1">1</text><text x="142" y="220" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">resolve observedstate.dev</text><path d="M434 252 L664 376" fill="none" stroke="#5b9bff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ab)" stroke-linejoin="round"/><text x="476" y="338" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b9bff" text-anchor="start" opacity="1">alias to the distribution</text><path d="M132 400 H664" fill="none" stroke="#3ddbb1" stroke-width="2" marker-end="url(#at)" stroke-linejoin="round"/><circle cx="160" cy="385" r="11" fill="#3ddbb1"/><text x="160" y="389.5" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0a1018" text-anchor="middle" opacity="1">2</text><text x="180" y="389" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8eef5" text-anchor="start" opacity="1">HTTPS GET /writing/post/</text><path d="M700 266 V364" fill="none" stroke="#5b9bff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ab)" marker-start="url(#abs)" stroke-linejoin="round"/><path d="M732 400 H1074" fill="none" stroke="#3ddbb1" stroke-width="2" marker-end="url(#at)" stroke-linejoin="round"/><circle cx="790" cy="385" r="11" fill="#3ddbb1"/><text x="790" y="389.5" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0a1018" text-anchor="middle" opacity="1">3</text><text x="810" y="389" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e8eef5" text-anchor="start" opacity="1">origin fetch on cache miss</text><text x="810" y="421" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3ddbb1" text-anchor="start" opacity="1">signed with OAC (SigV4)</text><path d="M1030 244 L730 374" fill="none" stroke="#f2b34a" stroke-width="2" marker-end="url(#aa)" stroke-linejoin="round"/><text x="880" y="338" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#f2b34a" text-anchor="start" opacity="1">TLS certificate</text><rect x="960" y="505" width="380" height="91" rx="10" fill="#121b27" stroke="#3ddbb1" stroke-width="1.5" opacity="1"/><rect x="960" y="515" width="4" height="71" rx="2" fill="#3ddbb1"/><text x="978" y="529" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3ddbb1" text-anchor="start" opacity="1">Bucket policy</text><text x="978" y="549" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Allow  cloudfront.amazonaws.com  s3:GetObject</text><text x="978" y="566" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Condition  AWS:SourceArn = this distribution</text><text x="978" y="583" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">No other principal can read the bucket</text><rect x="310" y="640" width="300" height="74" rx="10" fill="#121b27" stroke="#5b9bff" stroke-width="1.5" opacity="1"/><rect x="310" y="650" width="4" height="54" rx="2" fill="#5b9bff"/><text x="328" y="664" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#5b9bff" text-anchor="start" opacity="1">Error pages</text><text x="328" y="684" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">S3 403 and 404 both return</text><text x="328" y="701" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">/404.html with HTTP status 404</text><rect x="960" y="625" width="380" height="91" rx="10" fill="#121b27" stroke="#9b8cff" stroke-width="1.5" opacity="1"/><rect x="960" y="635" width="4" height="71" rx="2" fill="#9b8cff"/><text x="978" y="649" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9b8cff" text-anchor="start" opacity="1">Cache lifetimes (set at deploy)</text><text x="978" y="669" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">HTML and other files: public, max-age=300</text><text x="978" y="686" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">/_astro/* hashed assets: max-age=31536000, immutable</text><text x="978" y="703" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Every deploy invalidates /* at CloudFront</text><rect x="630" y="640" width="310" height="74" rx="10" fill="#121b27" stroke="#ff7a8a" stroke-width="1.5" opacity="1"/><rect x="630" y="650" width="4" height="54" rx="2" fill="#ff7a8a"/><text x="648" y="664" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ff7a8a" text-anchor="start" opacity="1">Deliberately not used</text><text x="648" y="684" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">S3 static website endpoint</text><text x="648" y="701" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">public ACLs or public bucket policy</text><rect x="40" y="784" width="16" height="16" rx="4" fill="#3ddbb1" stroke="#3a4b63" stroke-width="1"/><text x="64" y="797" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Storage</text><rect x="139" y="784" width="16" height="16" rx="4" fill="#5b9bff" stroke="#3a4b63" stroke-width="1"/><text x="163" y="797" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Networking and delivery</text><rect x="350" y="784" width="16" height="16" rx="4" fill="#f2b34a" stroke="#3a4b63" stroke-width="1"/><text x="374" y="797" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Security and identity</text><rect x="547" y="784" width="16" height="16" rx="4" fill="#9b8cff" stroke="#3a4b63" stroke-width="1"/><text x="571" y="797" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Management and cost</text><rect x="730" y="784" width="16" height="16" rx="4" fill="#121b27" stroke="#3a4b63" stroke-width="1"/><text x="754" y="797" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="start" opacity="1">Outside AWS</text><text x="1360" y="795" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#a9b6c6" text-anchor="end" opacity="1">solid = request path    dashed = configuration or lookup</text></svg>
